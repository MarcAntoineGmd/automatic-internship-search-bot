[project]
name = "canadian-internship-radar"
version = "1.0.0"
description = "Discord bot that DMs you new Canadian software-engineering internships"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = '-q -m "not live"'
markers = ["live: hits real public job APIs (run with: pytest -m live)"]
filterwarnings = ["ignore::DeprecationWarning:discord.*"]
