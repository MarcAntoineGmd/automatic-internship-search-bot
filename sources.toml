# Job sources for the Canadian SWE Internship Radar.
#
# Every [[kind]] table is one independent source. Set `enabled = false` to turn one off.
# `assume_country = "Canada"` tells the filter that a board only hires in Canada (used when a
# posting's location text is vague, e.g. "Hybrid").
#
# Verification (2026-11-11):
#   (live)   = board id confirmed by calling the public API; board had Canadian postings.
#   (simplify) = id taken from real application URLs in the SimplifyJobs / vanshb03 trackers.
# Board ids change occasionally; a broken one shows up under "Source errors" in /status.

# ============================================================================ Aggregators
# Largest source of Canadian postings, including companies without a supported ATS
# (Shopify, Google, Microsoft, Amazon, AMD, Qualcomm, Nokia, IBM, National Bank, ...).

[[github_listings]]
name = "simplify-summer2027"
company = "SimplifyJobs"
url = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"

[[github_listings]]
name = "vanshb03-summer2027"
company = "vanshb03"
url = "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"
resolve_redirects = true   # its links are go.vansh.nyc short links; resolve them for de-duplication

[[github_listings]]
name = "simplify-new-grad"
company = "SimplifyJobs"
url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
internships_only = false
enabled = false            # enable together with INCLUDE_NEW_GRAD=true

[[markdown_table]]
name = "canadian-tech-internships-2027"
company = "negarprh"
url = "https://raw.githubusercontent.com/negarprh/Canadian-Tech-Internships-2027/main/README.md"
assume_country = "Canada"

