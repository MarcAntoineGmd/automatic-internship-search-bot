# ============================================================================ Eightfold
# Public JSON behind some companies' own career sites: https://<host>/api/pcsx/search
[[eightfold]]
name = "autodesk"                  # (live) jobs.autodesk.com — Montréal / Toronto
company = "Autodesk"
host = "jobs.autodesk.com"
